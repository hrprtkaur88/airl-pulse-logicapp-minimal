<script>
/* Expand/collapse paired storyline cards by row. */
(function(){
  function syncRow(row, source){
    const details = Array.from(row.querySelectorAll('details.insight-toggle'));
    const targetState = source.open;
    details.forEach(function(d){
      if(d !== source) d.open = targetState;
    });
  }
  document.addEventListener('toggle', function(ev){
    const source = ev.target;
    if(!source.matches || !source.matches('details.insight-toggle')) return;
    const row = source.closest('[data-row-sync]');
    if(!row || row.dataset.syncing === '1') return;
    row.dataset.syncing = '1';
    syncRow(row, source);
    row.dataset.syncing = '0';
  }, true);
})();
</script>
<script>
/* Unified hover tooltip for heatmaps, benchmark bars, and demographic pies. */
(function(){
  const tip = document.createElement('div');
  tip.className = 'report-tooltip';

  document.addEventListener('DOMContentLoaded', function(){
    document.body.appendChild(tip);
  });

  function moveTip(ev){
    const pad = 12;
    const x = ev.clientX;
    const y = ev.clientY - 14;

    tip.style.left = x + 'px';
    tip.style.top = y + 'px';

    requestAnimationFrame(function(){
      const r = tip.getBoundingClientRect();
      let nx = x;
      let ny = y;

      if(r.left < pad) nx += (pad - r.left);
      if(r.right > window.innerWidth - pad) nx -= (r.right - (window.innerWidth - pad));
      if(r.top < pad) ny = ev.clientY + 24;

      tip.style.left = nx + 'px';
      tip.style.top = ny + 'px';
    });
  }

  function showTip(el, ev){
    const text = el.getAttribute('data-tooltip');
    if(!text) return;

    tip.textContent = text;
    tip.classList.add('show');
    moveTip(ev);
  }

  function hideTip(){
    tip.classList.remove('show');
  }

  document.addEventListener('mouseover', function(ev){
    const el = ev.target.closest('[data-tooltip]');
    if(el) showTip(el, ev);
  });

  document.addEventListener('mousemove', function(ev){
    const el = ev.target.closest('[data-tooltip]');
    if(el && tip.classList.contains('show')) moveTip(ev);
  });

  document.addEventListener('mouseout', function(ev){
    if(ev.target.closest('[data-tooltip]')) hideTip();
  });

  document.addEventListener('scroll', hideTip, true);
})();
</script>

<script>
/* Position the functional Focus Area pill against the visible heatmap table. */
(function(){
  function clamp(v,min,max){return Math.max(min, Math.min(max, v));}
  function isVisible(el){
    return !!(el && el.getClientRects().length && getComputedStyle(el).display !== 'none');
  }
  function positionFunctionalFocusPills(){
    document.querySelectorAll('section.functional-heat').forEach(function(section){
      var scroll=section.querySelector('.heat-scroll');
      var table=section.querySelector('.heat-table');
      var pill=section.querySelector('.function-opportunity-label');
      var first=section.querySelector('tr.priority-first td.cut-name');
      var last=section.querySelector('tr.priority-last td.cut-name') || first;
      if(!scroll || !table || !pill || !first || !last || !isVisible(section)) return;
      var scrollRect=scroll.getBoundingClientRect();
      var firstRect=first.getBoundingClientRect();
      var lastRect=last.getBoundingClientRect();
      var clusterHeight=Math.max(0, lastRect.bottom - firstRect.top);
      var pillHeight;
      if(clusterHeight <= 64){ pillHeight=70; }
      else if(clusterHeight <= 120){ pillHeight=78; }
      else{ pillHeight=clamp(clusterHeight - 20, 88, 112); }
      var top=(firstRect.top + (clusterHeight / 2)) - scrollRect.top - (pillHeight / 2);
      pill.style.setProperty('--focus-pill-left', '-30px');
      pill.style.setProperty('--focus-pill-top', top.toFixed(1) + 'px');
      pill.style.setProperty('--focus-pill-height', pillHeight.toFixed(1) + 'px');
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', positionFunctionalFocusPills);
  }else{
    positionFunctionalFocusPills();
  }
  window.addEventListener('load', positionFunctionalFocusPills);
  window.addEventListener('resize', positionFunctionalFocusPills);
  window.addEventListener('benchmarkchange', function(){
    requestAnimationFrame(function(){ requestAnimationFrame(positionFunctionalFocusPills); });
  });
})();
</script>


<script>
/* Benchmark comparison toggle for dual-benchmark reports. */
(function(){
  function setBenchmark(id){
    if(!id) return;
    document.querySelectorAll('[data-benchmark-view]').forEach(function(el){
      el.hidden = el.getAttribute('data-benchmark-view') !== id;
    });
    document.querySelectorAll('[data-benchmark-toggle]').forEach(function(btn){
      var active = btn.getAttribute('data-benchmark-toggle') === id;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    requestAnimationFrame(function(){
      window.dispatchEvent(new Event('benchmarkchange'));
    });
  }
  document.addEventListener('click', function(ev){
    var btn = ev.target.closest('[data-benchmark-toggle]');
    if(!btn) return;
    setBenchmark(btn.getAttribute('data-benchmark-toggle'));
  });
  document.addEventListener('DOMContentLoaded', function(){
    var active = document.querySelector('[data-benchmark-toggle].active') || document.querySelector('[data-benchmark-toggle]');
    if(active) setBenchmark(active.getAttribute('data-benchmark-toggle'));
  });
})();
</script>

<script>
/* Sticky jump-nav active section sync. */
(function(){
  function initJumpNav(){
    var nav = document.querySelector('.report-jump-nav');
    if(!nav) return;
    var links = Array.from(nav.querySelectorAll('.jump-nav-link[href^="#"]'));
    var sections = links.map(function(link){
      var id = link.getAttribute('href').slice(1);
      var section = document.getElementById(id);
      return section ? {id:id, link:link, section:section} : null;
    }).filter(Boolean);
    if(!sections.length) return;

    var ticking = false;
    function setActive(active){
      sections.forEach(function(item){
        item.link.classList.toggle('active', item === active);
        if(item === active){ item.link.setAttribute('aria-current','true'); }
        else{ item.link.removeAttribute('aria-current'); }
      });
    }
    var navLinksVisible = false;
    var navStuck = false;
    function syncNavState(){
      var hero = document.querySelector('.hero');
      var heroRect = hero ? hero.getBoundingClientRect() : null;
      var navRect = nav.getBoundingClientRect();
      var heroBottom = heroRect ? heroRect.bottom : 0;
      var navHeight = Math.max(navRect.height || 0, 118);
      var showAt = navHeight + 70;
      var hideAt = navHeight + 150;
      var stickAt = navHeight + 20;
      var unstickAt = navHeight + 120;
      if(!navLinksVisible && heroBottom <= showAt){ navLinksVisible = true; }
      else if(navLinksVisible && heroBottom >= hideAt){ navLinksVisible = false; }
      if(!navStuck && heroBottom <= stickAt){ navStuck = true; }
      else if(navStuck && heroBottom >= unstickAt){ navStuck = false; }
      nav.classList.toggle('is-stuck', navStuck);
      nav.classList.toggle('nav-links-visible', navLinksVisible);
      var benchmarkControl = document.querySelector('.benchmark-toggle');
      if(benchmarkControl){ benchmarkControl.classList.toggle('is-visible', navStuck && navLinksVisible); }
    }
    function chooseActive(){
      ticking = false;
      syncNavState();
      var doc = document.documentElement;
      var nearBottom = window.innerHeight + window.scrollY >= doc.scrollHeight - 8;
      if(nearBottom){
        setActive(sections[sections.length - 1]);
        return;
      }
      var anchorY = window.innerHeight * 0.38;
      var best = sections[0];
      var bestDist = Infinity;
      sections.forEach(function(item){
        var rect = item.section.getBoundingClientRect();
        var center = rect.top + (rect.height / 2);
        var dist = Math.abs(center - anchorY);
        if(dist < bestDist){
          bestDist = dist;
          best = item;
        }
      });
      setActive(best);
    }
    function requestUpdate(){
      if(ticking) return;
      ticking = true;
      window.requestAnimationFrame(chooseActive);
    }
    chooseActive();
    window.addEventListener('scroll', requestUpdate, {passive:true});
    window.addEventListener('resize', requestUpdate);
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initJumpNav);
  }else{
    initJumpNav();
  }
})();
</script>
